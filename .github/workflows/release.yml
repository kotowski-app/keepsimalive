name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; creating the release needs write
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle.kts', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run checks
        run: ./gradlew check --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPS_BASE64: ${{ secrets.RELEASE_KEYSTORE_PROPS_BASE64 }}
        run: |
          mkdir -p local
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > local/release.keystore
          echo "$RELEASE_KEYSTORE_PROPS_BASE64" | base64 -d > local/release-keystore.properties

      - name: Build release APK
        run: ./gradlew assembleVanillaRelease --no-daemon --stacktrace

      - name: Extract versionCode
        id: version
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/vanilla/release/*.apk)
          echo "code=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/vanilla/release/*.apk
          body_path: fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
